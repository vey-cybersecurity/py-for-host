<nav class="navbar">
    <div class="nav-container">
        <a href="{{ url_for('index') }}" class="nav-logo">Vaii Store</a>
        
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a></li>
            <li><a href="{{ url_for('products') }}" class="{% if request.endpoint == 'products' %}active{% endif %}">Products</a></li>
        </ul>
        
        <div class="nav-actions">
            {% if session.get('user_id') %}
                {% if session.get('user_role') in ['Admin', 'Super Admin', 'Product Manager'] %}
                <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary" style="padding: 0.5rem 1rem; border-color: rgba(14, 165, 233, 0.4);"><i class="fa-solid fa-gauge-high"></i> Admin</a>
                {% endif %}
                <span style="font-size: 0.875rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.4rem;">
                    <i class="fa-solid fa-circle-user" style="color: var(--accent-color);"></i> {{ session.get('user_name') }}
                </span>
                <a href="{{ url_for('logout') }}" class="btn btn-secondary" style="padding: 0.5rem 1rem; border-color: rgba(239, 68, 68, 0.3); color: #fca5a5;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="btn btn-secondary" style="padding: 0.5rem 1rem;">Login</a>
                <a href="{{ url_for('register') }}" class="btn btn-primary" style="padding: 0.5rem 1rem;">Register</a>
            {% endif %}
            <a href="{{ url_for('cart') }}" class="cart-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge">{{ cart_items|length if cart_items else 0 }}</span>
            </a>
        </div>
    </div>
</nav>
